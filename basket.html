<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Кошик — GameZone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-page="basket">

<header class="header">
    <div class="container header-container">
        <a href="index.html" class="logo">GameZone</a>

        <nav class="navigation">
            <a href="index.html">Головна</a>
            <a href="store.html">Магазин</a>

            <a href="basket.html" class="active">
                Кошик
                <span class="cart-count">0</span>
            </a>
        </nav>
    </div>
</header>

<main>
    <section class="page-banner">
        <div class="container">
            <p class="section-label">
                Ваше замовлення
            </p>

            <h1>Кошик</h1>

            <p>
                Перевірте вибрані ігри та підтвердьте покупку.
            </p>
        </div>
    </section>

    <section class="basket-section">
        <div class="container basket-layout">
            <div class="basket-content">
                <div id="basketItems"></div>
            </div>

            <aside class="order-summary">
                <h2>Оформлення замовлення</h2>

                <div class="summary-row">
                    <span>Кількість товарів:</span>
                    <strong id="totalQuantity">0</strong>
                </div>

                <div class="summary-row summary-total">
                    <span>Загальна сума:</span>
                    <strong id="totalPrice">0 грн</strong>
                </div>

                <form id="checkoutForm" class="checkout-form">
                    <div class="form-group">
                        <label for="customerName">
                            Ваше ім’я
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            placeholder="Наприклад: Андрій"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="customerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="customerEmail"
                            placeholder="example@gmail.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="paymentMethod">
                            Спосіб оплати
                        </label>

                        <select id="paymentMethod" required>
                            <option value="">
                                Оберіть спосіб оплати
                            </option>

                            <option value="card">
                                Банківська картка
                            </option>

                            <option value="cash">
                                Оплата при отриманні
                            </option>
                        </select>
                    </div>

                    <button
                        type="submit"
                        class="button order-button"
                    >
                        Підтвердити покупку
                    </button>
                </form>
            </aside>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container footer-container">
        <p>© 2026 GameZone</p>
        <p>Навчальний приклад магазину ігор</p>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
